distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
# Raised from the template's 10000. services.gradle.org 307-redirects to GitHub
# release assets, which took ~31s to send a first byte on a cold fetch here — the
# 10s default aborts mid-redirect with a bare SocketTimeoutException and no hint
# that the *download*, not the build, is what failed. Only affects fetching the
# Gradle distribution itself, so a generous value costs nothing once it is cached.
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
