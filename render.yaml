# Render Blueprint — infrastructure as code for the API.
#
# Declared in the repo rather than clicked together in the dashboard so the deploy is
# reproducible and reviewable. Render reads this on "New Blueprint"; every value below
# is one that a hand-configured service gets silently wrong.
#
# See docs/deployment.md for the walkthrough, including the Atlas side.
services:
  - type: web
    name: modulus-todo-api
    runtime: node
    plan: free

    # Closest free region to the reviewer. Free instances spin down after ~15
    # minutes idle and cold-start in roughly a minute — the README says so, and the
    # mobile client's request timeout and splash cap are both sized for it.
    region: singapore

    # The repo holds two apps. Without this Render builds from the root, finds no
    # buildable project, and fails with a confusingly generic error.
    rootDir: apps/api

    # `npm ci` — not `npm install` — so the lockfile is authoritative. Deliberately
    # NOT `--ignore-scripts`: argon2 is a native addon whose `node-gyp-build` step
    # runs as an install script, and skipping it yields a module that cannot hash.
    buildCommand: npm ci && npm run build
    startCommand: node dist/main

    # Mounted at the root, outside the /api/v1 prefix, precisely so this path stays
    # stable across API versions. It returns 200 with a `degraded` database status
    # while Mongo is still connecting, so a cold start is not mistaken for a failed
    # deploy and rolled back.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Pinned to match .nvmrc and CI. Render's default Node is whatever it happens
      # to be today; a silent major bump is not something to discover on deploy day.
      # Set explicitly because rootDir is apps/api, so the root .nvmrc is not read.
      - key: NODE_VERSION
        value: 22.18.0

      # ── Set by hand in the dashboard ──────────────────────────────────────────
      # `sync: false` means "prompt me, never store it in git". This is the Atlas
      # SRV string and it contains a password.
      - key: MONGODB_URI
        sync: false

      # ── Generated by Render, never seen by anyone ─────────────────────────────
      # `generateValue` has Render mint a strong random value on first deploy. Better
      # than generating them locally: the secrets never exist outside Render, so they
      # cannot leak through a terminal history, a chat log, or a screenshot.
      #
      # ⚠️ Config validation requires ≥32 characters (see src/config/env.validation.ts).
      # If a deploy ever fails with "length must be at least 32 characters long",
      # replace these with values from:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true

      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: 30

      # A native app sends no Origin header, so an empty allowlist is correct here —
      # the app still works and arbitrary browser origins are still refused. Never '*'.
      - key: CORS_ORIGINS
        value: ''

      - key: AUTH_RATE_LIMIT
        value: 10

      # Render terminates TLS at a shared load balancer, so exactly one proxy sits in
      # front of the app. Leave this at 0 and Express reports the proxy's address as
      # req.ip for every caller — the per-IP auth rate limit quietly becomes a global
      # one, and one person mistyping a password twice locks out everybody.
      - key: TRUST_PROXY
        value: 1
